name: Autograding Tests

on:
  push:
    paths:
      - 'assignment.py'
      - 'test_assignment.py'
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Ex 1 - Stack set up
        id: ex1_initial_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Stack set up
          command: pytest test_assignment.py::test1_initial_stack
          timeout: 2
          max-score: 1

      - name: Ex 1 - IsEmpty
        id: ex1_is_empty
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - IsEmpty
          command: pytest test_assignment.py::test1_is_empty
          timeout: 2
          max-score: 1

      - name: Ex 1 - IsFull
        id: ex1_is_full
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - IsFull
          command: pytest test_assignment.py::test1_is_full
          timeout: 2
          max-score: 1

      - name: Ex 2 - Push
        id: ex2_push
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Push
          command: pytest test_assignment.py::test2_push
          timeout: 2
          max-score: 1

      - name: Ex 2 - Push when full
        id: ex2_push_when_full
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Push when full
          command: pytest test_assignment.py::test2_push_when_full
          timeout: 2
          max-score: 1

      - name: Ex 2 - Uses TopOfStack
        id: ex2_uses_top_of_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Uses TopOfStack
          command: pytest test_assignment.py::test2_uses_top_of_stack
          timeout: 2
          max-score: 1

      - name: Ex 3 - Pop
        id: ex3_pop
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Pop
          command: pytest test_assignment.py::test3_pop
          timeout: 2
          max-score: 1

      - name: Ex 3 - Pop when empty
        id: ex3_pop_when_empty
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Pop when empty
          command: pytest test_assignment.py::test3_pop_when_empty
          timeout: 2
          max-score: 1

      - name: Ex 3 - Uses TopOfStack
        id: ex3_uses_top_of_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Uses TopOfStack
          command: pytest test_assignment.py::test3_uses_top_of_stack
          timeout: 2
          max-score: 1

      - name: Ex 4 - Peek
        id: ex4_peek
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Peek
          command: pytest test_assignment.py::test4_peek
          timeout: 2
          max-score: 1

      - name: Ex 4 - Size
        id: ex4_size
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 4 - Size
          command: pytest test_assignment.py::test4_size
          timeout: 2
          max-score: 1

      - name: Ex 5 - Reverse word
        id: ex5_reverse_word
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 5 - Reverse word
          command: pytest test_assignment.py::test5_reverse_word
          timeout: 2
          max-score: 1

      - name: Ex 5 - Starts with empty stack
        id: ex5_starts_with_empty_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 5 - Starts with empty stack
          command: pytest test_assignment.py::test5_starts_with_empty_stack
          timeout: 2
          max-score: 1

      - name: Ex 5 - Uses the stack
        id: ex5_uses_the_stack
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 5 - Uses the stack
          command: pytest test_assignment.py::test5_uses_the_stack
          timeout: 2
          max-score: 1

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EX1_INITIAL_STACK_RESULTS: "${{ steps.ex1_initial_stack.outputs.result }}"
          EX1_IS_EMPTY_RESULTS: "${{ steps.ex1_is_empty.outputs.result }}"
          EX1_IS_FULL_RESULTS: "${{ steps.ex1_is_full.outputs.result }}"
          EX2_PUSH_RESULTS: "${{ steps.ex2_push.outputs.result }}"
          EX2_PUSH_WHEN_FULL_RESULTS: "${{ steps.ex2_push_when_full.outputs.result }}"
          EX2_USES_TOP_OF_STACK_RESULTS: "${{ steps.ex2_uses_top_of_stack.outputs.result }}"
          EX3_POP_RESULTS: "${{ steps.ex3_pop.outputs.result }}"
          EX3_POP_WHEN_EMPTY_RESULTS: "${{ steps.ex3_pop_when_empty.outputs.result }}"
          EX3_USES_TOP_OF_STACK_RESULTS: "${{ steps.ex3_uses_top_of_stack.outputs.result }}"
          EX4_PEEK_RESULTS: "${{ steps.ex4_peek.outputs.result }}"
          EX4_SIZE_RESULTS: "${{ steps.ex4_size.outputs.result }}"
          EX5_REVERSE_WORD_RESULTS: "${{ steps.ex5_reverse_word.outputs.result }}"
          EX5_STARTS_WITH_EMPTY_STACK_RESULTS: "${{ steps.ex5_starts_with_empty_stack.outputs.result }}"
          EX5_USES_THE_STACK_RESULTS: "${{ steps.ex5_uses_the_stack.outputs.result }}"
        with:
          runners: ex1_initial_stack,ex1_is_empty,ex1_is_full,ex2_push,ex2_push_when_full,ex2_uses_top_of_stack,ex3_pop,ex3_pop_when_empty,ex3_uses_top_of_stack,ex4_peek,ex4_size,ex5_reverse_word,ex5_starts_with_empty_stack,ex5_uses_the_stack
